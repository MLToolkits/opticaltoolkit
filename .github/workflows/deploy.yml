name: CD

on:
  push:
    tags: ['v*']

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --no-root

      - name: Add version to environment
        run: |
          echo "PROJECT_VERSION=$(poetry version --short)" >> $GITHUB_ENV

      - name: Run tests
        run: poetry run pytest -v -k "not slow"

      - name: Build artifacts
        run: poetry build --no-interaction

      - name: Generate Release Notes
        run: |
          git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty='format:* %h %s' --no-merges > .github/release_template.md

      - name: Create Release Draft
        uses: softprops/action-gh-release@v1
        with:
          body_path: ".github/release_template.md"
          draft: true
          files: |
            dist/optical_toolkit-${{ env.PROJECT_VERSION }}-py3-none-any.whl
            dist/optical_toolkit-${{ env.PROJECT_VERSION }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
